<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>FA - FTU App Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-bg">
    <section class="iphone-frame">
      <div class="dynamic-island"></div>
      <div id="bannerContainer" class="banner-container"></div>

      <div id="loginScreen" class="login-card">
        <img src="assets/ftu-seal.svg" class="logo" alt="FTU Logo" />
        <h1>FA • FTU App</h1>
        <p>FTU Campus Super App Prototype</p>
        <input id="studentId" value="2312280041" placeholder="Student ID" />
        <input id="studentPin" value="1" type="password" placeholder="PIN" />
        <button id="studentLoginBtn">Sign in Student</button>
      </div>

      <div id="appScreen" class="app-shell hidden">
        <header>
          <button class="ghost-btn" id="backBtn">‹</button>
          <div class="user-pill" id="studentName">Student</div>
          <button class="logout" id="logoutBtn" title="Logout" aria-label="Logout">⏻</button>
        </header>

        <section id="homeScreen" class="screen">
          <section class="balance-banner">
            <p>Campus Wallet</p>
            <h2 id="balanceText">0 VND</h2>
            <span id="studentIdText"></span>
          </section>
          <section class="features-grid">
            <button class="feature-btn minimal" data-target="walletHubScreen" title="Wallet" aria-label="Wallet"><span class="icon">👛</span></button>
            <button class="feature-btn minimal" data-target="preOrderScreen" title="Pre-order" aria-label="Pre-order"><span class="icon">☕</span></button>
            <button class="feature-btn minimal" data-target="roomScreen" title="Room booking" aria-label="Room booking"><span class="icon">🏫</span></button>
            <button class="feature-btn minimal" data-target="libraryScreen" title="Library" aria-label="Library"><span class="icon">📖</span></button>
            <button class="feature-btn minimal" data-target="idCardScreen" title="ID Card" aria-label="ID Card"><span class="icon">🪪</span></button>
          </section>
          <section class="features-labels">
            <span>Wallet</span><span>Pre-order</span><span>Room</span><span>Library</span><span>ID</span>
          </section>
        </section>

        <section id="walletHubScreen" class="screen hidden">
          <h3>Wallet</h3>
          <div class="wallet-actions">
            <button class="feature-btn minimal" data-target="payScreen"><span class="icon">💸</span><span>Pay</span></button>
            <button class="feature-btn minimal" data-target="receiveScreen"><span class="icon">📥</span><span>Receive</span></button>
          </div>
        </section>

        <section id="payScreen" class="screen hidden">
          <h3>Pay QR</h3>
          <div id="payQrBox" class="qr-box"></div>
          <div class="code" id="payCodeText">------</div>
          <div class="countdown-wrap"><div id="countdownBar" class="countdown"></div></div>
          <p id="countText">Refresh in 0s</p>
          <button id="refreshPayBtn">Refresh now</button>
          <h4>Recent transactions</h4>
          <div id="txList" class="tx-list"></div>
        </section>

        <section id="receiveScreen" class="screen hidden">
          <h3>Receive</h3>
          <label>Top-up amount (VND)</label>
          <input id="topupAmount" type="number" value="100000" min="1000" step="1000" />
          <div id="receiveQrBox" class="qr-box"></div>
          <p id="receiveText" class="sub-text"></p>
          <button id="generateTopupBtn">Generate new top-up QR</button>
          <button id="confirmTopupBtn" class="secondary-btn">I paid this QR (demo add balance)</button>
        </section>

        <section id="preOrderScreen" class="screen hidden">
          <h3>F.HUB Menu</h3>
          <div id="menuList" class="menu-list"></div>
        </section>

        <section id="roomScreen" class="screen hidden">
          <h3>Room Booking</h3>
          <div id="roomList" class="room-list"></div>
        </section>

        <section id="libraryScreen" class="screen hidden">
          <h3>Library Card QR</h3>
          <div id="libraryQrBox" class="qr-box"></div>
          <p class="sub-text" id="libraryText"></p>
        </section>

        <section id="idCardScreen" class="screen hidden">
          <h3>Student ID QR</h3>
          <div id="idQrBox" class="qr-box"></div>
          <p class="sub-text" id="idText"></p>
        </section>

        <nav>
          <button id="homeBtn" class="active">Home</button>
          <button data-target="walletHubScreen">Wallet</button>
        </nav>
      </div>
    </section>

    <aside class="merchant-panel">
      <h3>Merchant POS</h3>
      <p>Demo merchant: <b>FTU Canteen A</b></p>
      <label>Service</label>
      <select id="serviceSelect">
        <option value="canteen">Canteen</option>
        <option value="coffee">Coffee</option>
        <option value="room">Room fee</option>
      </select>
      <label>Amount (VND)</label>
      <input id="amountInput" value="35000" />
      <label>Enter token or 6-digit code</label>
      <input id="tokenInput" placeholder="token / code" />
      <button id="chargeBtn">Charge Student Wallet</button>
      <p class="msg" id="merchantMsg">Waiting...</p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
